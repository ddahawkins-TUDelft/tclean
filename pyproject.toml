[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tclean"
version = "0.0.0"
description = "Tools for cleaning, validating, and reconstructing electricity-demand time series."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Dano Hawkins" }
]
dependencies = [
    "pandas>=3.0.3",
    "pandera>=0.31.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tclean"]

[tool.pytest.ini_options]
testpaths = ["tests"]